include: package:flutter_lints/flutter.yaml
dart_code_metrics:
  metrics:
    cyclomatic-complexity: 20
    lines-of-code: 100
    number-of-parameters: 4
    number-of-methods: 20
  rules:
    - avoid-late-keywords
    - avoid-non-null-assertion
    - prefer-immutable
    - avoid-magic-number
    - avoid-returning-widgets
    - prefer-async-await
  anti-patterns:
    - long-method
    - long-parameter-list
